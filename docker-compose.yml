services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: friendmap
      POSTGRES_USER: friendmap
      POSTGRES_PASSWORD: friendmap_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friendmap"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://friendmap:friendmap_dev@postgres:5432/friendmap
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-do-not-use-in-production
      JWT_EXPIRY: 24h
      API_PORT: "3000"
      CLIENT_URL: http://localhost:5173
      MAX_SPEED_KMH: "500"
      TIMESTAMP_MAX_AGE_SEC: "60"
      TIMESTAMP_MAX_FUTURE_SEC: "10"
      LOCATION_TTL_SEC: "86400"
      LOGIN_RATE_LIMIT: "5"
      LOGIN_RATE_TTL_SEC: "60"
      WS_LOCATION_RATE_PER_SEC: "1"
      WS_LOCATION_BURST: "3"

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
