apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: friendmap
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: friends-maps-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: friendmap-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: friendmap-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: friendmap
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
      name: http
