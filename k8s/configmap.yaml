apiVersion: v1
kind: ConfigMap
metadata:
  name: friendmap-config
  namespace: friendmap
data:
  API_PORT: "3000"
  DATABASE_URL: "postgresql://friendmap:friendmap_secure_pass@postgres.friendmap.svc.cluster.local:5432/friendmap"
  REDIS_URL: "redis://redis.friendmap.svc.cluster.local:6379"
  CLIENT_URL: "https://map.enterprise-ai.online"
  JWT_EXPIRY: "24h"
  MAX_SPEED_KMH: "500"
  TIMESTAMP_MAX_AGE_SEC: "60"
  TIMESTAMP_MAX_FUTURE_SEC: "10"
  LOCATION_TTL_SEC: "86400"
  LOGIN_RATE_LIMIT: "5"
  LOGIN_RATE_TTL_SEC: "60"
  WS_LOCATION_RATE_PER_SEC: "1"
  WS_LOCATION_BURST: "3"
